name: Build On ARM Docker Container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  run-arm-container:
    # Native arm64 runner: build-docker.sh detects aarch64 and skips qemu/binfmt
    # entirely, matching the working native build on the Raspberry Pi. Emulated
    # arm64 builds on x86 runners are unreliable for pi-gen.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run build script
        run: ./build-docker.sh

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v5
        with:
          name: deploy
          path: deploy/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: deploy/*.zip